/* v2.2 — multi-column overview for landscape iPad */
.topbar{gap:12px}
.topright{gap:14px}
.layout-switch{display:flex;align-items:center;gap:5px;border:1px solid #3c4248;border-radius:9px;padding:4px 5px;flex:none}
.layout-switch .switch-label{font-size:10px;font-weight:730;letter-spacing:.075em;color:#b5bbc2;padding:0 7px 0 5px;white-space:nowrap}
.layout-switch button{border:1px solid transparent;border-radius:6px;background:transparent;height:34px;min-width:36px;padding:0 7px;font-size:14px;font-weight:800;color:#bcc3ca;touch-action:manipulation}
.layout-switch button[aria-pressed="true"]{background:#f3f5f6;color:#0c0f11;border-color:#f3f5f6}
.layout-switch button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.counter{font-size:12px;font-weight:690;color:#adb5be;white-space:nowrap}
#timers.layout-2{grid-template-columns:repeat(2,minmax(0,1fr))}
#timers.layout-3{grid-template-columns:repeat(3,minmax(0,1fr))}
#timers.layout-4{grid-template-columns:repeat(4,minmax(0,1fr))}
#timers.layout-3,#timers.layout-4{grid-auto-rows:clamp(228px,calc((100dvh - 264px)/2),370px);gap:9px}
#timers.layout-3 .timer,#timers.layout-4 .timer{padding:13px 13px 12px;overflow:hidden}
#timers.layout-3 .timer-main{gap:6px}
#timers.layout-3 .ring{width:clamp(64px,7.3vw,101px);height:clamp(64px,7.3vw,101px)}
#timers.layout-3 .ring-center{font-size:10px;font-weight:650;line-height:1.16}
#timers.layout-3 .ring circle{stroke-width:8}
#timers.layout-3 .state{font-size:10px;min-height:12px;margin-bottom:5px}
#timers.layout-3 .timer-title{font-size:clamp(17px,1.83vw,26px);line-height:1.1;-webkit-line-clamp:3}

#timers.layout-3 .timer-title{min-height:1.2em}
.action .short-label{display:none}

#timers.layout-3 .action .short-label,#timers.layout-4 .action .short-label{display:inline}
/* Four timers per row: compact reading-first cards, a small horizontal progress bar replaces the bulky ring. */
#timers.layout-4 .timer-main{display:flex;align-items:stretch}
#timers.layout-4 .timer-info{width:100%;justify-content:center;min-width:0}
#timers.layout-4 .ring{display:none}
#timers.layout-4 .state{font-size:10px;margin-bottom:8px;min-height:12px}
#timers.layout-4 .timer-title{font-size:clamp(17px,1.58vw,23px);line-height:1.12;min-height:1.12em;-webkit-line-clamp:3}

#timers.layout-4 .timer-actions{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.8fr) 30px;gap:4px;margin-top:10px}

#timers.layout-4 .timer.ended .progress-value{background:white}
#timers.layout-4 .timer.ended .state{color:white}
@media(max-width:1100px){
  .topbar h1{font-size:24px}

  #timers.layout-2,#timers.layout-3,#timers.layout-4{grid-template-columns:1fr}

<body>
<div class="shell">
 <header class="topbar"><h1>Kitchen Controller</h1><div class="topright"><span class="counter" id="timerCounter" aria-live="polite">0 TIMER</span><div class="layout-switch" role="group" aria-label="Numero di timer per riga"><span class="switch-label">PER RIGA</span><button type="button" data-columns="2" aria-pressed="false" title="2 timer per riga">2</button><button type="button" data-columns="3" aria-pressed="true" title="3 timer per riga">3</button><button type="button" data-columns="4" aria-pressed="false" title="4 timer per riga">4</button></div><time id="clock" class="clock">--:--</time><button class="gear" id="settingsButton" aria-label="Impostazioni">IMPOSTAZIONI</button></div></header>
 <section class="launches" aria-label="Avvia cotture">
  <div class="panel"><div class="preset-header"><h2>Nuovo timer manuale</h2><button class="simple-link" id="advancedButton" type="button">PERSONALIZZA</button></div><form id="quickForm" class="manual-form"><label class="field"><span>Minuti</span><input id="quickMinutes" name="minutes" type="number" min="0" max="9999" step="1" value="10" inputmode="numeric" required></label><label class="field"><span>Nome cottura / nota</span><input id="quickName" name="name" type="text" maxlength="120" placeholder="Es. Cottura pizza tonda" autocomplete="off" required></label><button type="submit" class="btn primary big">AVVIA TIMER</button></form></div>
  <div class="panel"><div class="preset-header"><h2>Tempi predefiniti</h2><button class="simple-link" id="manageButton" type="button">GESTISCI</button></div><div class="preset-buttons" id="presetButtons"></div></div>
 </section>
 <main class="grid-wrap" id="scrollArea"><section class="timers layout-3" id="timers" aria-label="Timer attivi"></section></main>
</div>
<div class="portrait-warning">Per una visione migliore ruota l’iPad in orizzontale.</div>
<div class="overlay" id="overlay" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle">Titolo</h2><button class="close" id="closeDialog" aria-label="Chiudi">×</button></div><div class="dialog-body" id="dialogBody"></div></div></div>
<script>
(()=>{'use strict';
const COLORS=[{key:'red',hex:'#ff444d',label:'Rosso'},{key:'yellow',hex:'#e8be33',label:'Giallo'},{key:'green',hex:'#45d58b',label:'Verde'},{key:'blue',hex:'#438ff3',label:'Blu'},{key:'purple',hex:'#b47aee',label:'Viola'},{key:'orange',hex:'#f59b48',label:'Arancione'}];
const START_PRESETS=[{id:'pizza',name:'Pizza',secs:420,color:'red'},{id:'pasta',name:'Pasta',secs:600,color:'yellow'},{id:'verdure',name:'Verdure',secs:300,color:'green'},{id:'brasato',name:'Brasato',secs:10800,color:'purple'}];
const KEY='kitchen_controller_v21_data';
const $=id=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}
const old=read();
let timers=Array.isArray(old?.timers)?old.timers.filter(t=>t&&typeof t.id==='string'&&Number.isFinite(t.duration)&&t.duration>0):[];
let presets=Array.isArray(old?.presets)?old.presets:START_PRESETS.map(p=>({...p}));
let sound=old?.sound!==false;
let columns=[2,3,4].includes(Number(old?.columns))?Number(old.columns):3;
let soundPlaying=false;
let alarmLoop=null,audio=null,wake=null, modalMode='',activeId=null,editId=null,choiceColor='blue',pendingProtectedAction=null;
let lastSave=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify({timers,presets,sound,columns}))}catch(e){}}
function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function accent(c){return COLORS.find(x=>x.key===c)?.hex||'#438ff3'}
function duration(s){s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;return (h?`${h}:`:'')+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
function presetDur(s){return s>=3600?`${Math.round(s/3600*10)/10} h`:s>=60?`${Math.floor(s/60)} min`:`${s} sec`}
function seconds(t,now=Date.now()){return t.status==='running'?Math.max(0,Math.ceil((t.endAt-now)/1000)):Math.max(0,t.remaining||0)}
function clock(){ $('clock').textContent=new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}) }
function ensureAudio(){if(!sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audio)audio=new AC();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch(e){}}
function beep(){if(!sound||!audio||audio.state!=='running')return;try{const base=audio.currentTime+.015;for(let i=0;i<3;i++){const start=base+i*.21,o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.setValueAtTime(i%2?690:910,start);g.gain.setValueAtTime(.0001,start);g.gain.linearRampToValueAtTime(.20,start+.015);g.gain.setValueAtTime(.20,start+.145);g.gain.exponentialRampToValueAtTime(.0001,start+.19);o.connect(g);g.connect(audio.destination);o.start(start);o.stop(start+.20)}}catch(e){}}
function stopSoundIfClear(){if(soundPlaying&&!timers.some(t=>t.status==='ended'&&!t.silenced)){soundPlaying=false;clearInterval(alarmLoop);alarmLoop=null}}
function alarmStart(){if(!sound||!timers.some(t=>t.status==='ended'&&!t.silenced))return;ensureAudio();if(soundPlaying)return;soundPlaying=true;beep();alarmLoop=setInterval(()=>{if(!soundPlaying)return;beep()},1200);try{navigator.vibrate?.([280,140,280])}catch(e){}}
async function wakeUp(){if(wake||!navigator.wakeLock||document.visibilityState!=='visible'||!timers.some(t=>t.status==='running'))return;try{wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}catch(e){wake=null}}
function releaseWake(){if(wake&&!timers.some(t=>t.status==='running')){wake.release().catch(()=>{});wake=null}}
function start(name,secs,color='blue',kind='manual'){ensureAudio();timers.unshift({id:uid(),name:String(name).trim().slice(0,120)||'Timer',duration:secs,remaining:secs,endAt:Date.now()+secs*1000,status:'running',color,kind,pin:'',silenced:false});save();render();wakeUp();$('scrollArea').scrollTop=0}
function renderPresets(){$('presetButtons').innerHTML=presets.slice(0,4).map(p=>`<button class="preset" data-preset="${safe(p.id)}" style="--accent:${accent(p.color)}" title="Avvia ${safe(p.name)}"><span class="pname">${safe(p.name)}</span><span class="pdur">${safe(presetDur(p.secs))}</span></button>`).join('')}
const trashSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>';
function card(t){const now=Date.now(),remaining=seconds(t,now),percent=t.status==='ended'?1:Math.max(0,Math.min(1,remaining/t.duration)),circ=2*Math.PI*45;
 const ended=t.status==='ended',paused=t.status==='paused',label=ended?'TEMPO SCADUTO':paused?'IN PAUSA':'IN COTTURA';
 const first=ended?(t.silenced?'RIPETI':'FERMA ALLARME'):paused?'RIPRENDI':'PAUSA';
 return `<article class="timer ${safe(t.status)}" data-id="${safe(t.id)}" style="--accent:${accent(t.color)}"><div class="timer-main"><div class="timer-info"><div class="state">${ended?(t.silenced?'COTTURA TERMINATA':'ALLARME FORTE'):paused?'TIMER IN PAUSA':'&nbsp;'}</div><h3 class="timer-title" title="${safe(t.name)}">${safe(t.name)}</h3><div class="countdown" data-time>${duration(remaining)}</div></div><div class="ring" aria-label="Avanzamento ${Math.round((1-percent)*100)} per cento"><svg viewBox="0 0 110 110"><circle class="track" cx="55" cy="55" r="45"/><circle class="value" cx="55" cy="55" r="45" stroke-dasharray="${circ.toFixed(3)}" stroke-dashoffset="${(circ*(1-percent)).toFixed(3)}" data-ring /></svg><span class="ring-center">${label}</span></div></div><div class="compact-progress" aria-hidden="true"><div class="progress-value" style="--progress:${(ended?100:Math.round((1-percent)*100))}%" data-bar></div></div><div class="timer-actions"><button class="action main ${ended?'danger':''}" data-action="toggle"><span class="long-label">${first}</span><span class="short-label">${ended?(t.silenced?'RIPETI':'FERMA'):paused?'AVVIA':'PAUSA'}</span></button><button class="action" data-action="reset">RESET</button><button class="action ${t.pin?'locked':''}" data-action="lock"><span class="long-label">${t.pin?'BLOCCATO':'LUCCHETTO'}</span><span class="short-label">${t.pin?'LOCK':'PIN'}</span></button><button class="action icon" data-action="delete" aria-label="Elimina timer ${safe(t.name)}" title="Elimina">${trashSvg}</button></div></article>`}
function setColumns(n){columns=[2,3,4].includes(Number(n))?Number(n):3;$('timers').classList.remove('layout-2','layout-3','layout-4');$('timers').classList.add('layout-'+columns);document.querySelectorAll('[data-columns]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.columns)===columns)));save()}
function render(){const root=$('timers');$('timerCounter').textContent=timers.length+' TIMER';if(!timers.length){root.innerHTML=`<div class="empty"><strong>Nessuna cottura in corso</strong><p>Avvia un timer manuale oppure scegli una preparazione predefinita. Tutti i timer compariranno qui, contemporaneamente.</p><div class="empty-actions"><button class="btn primary" id="showCustom">NUOVO TIMER</button><button class="btn" id="demoButton">VEDI ESEMPIO</button></div></div>`;return}root.innerHTML=timers.map(card).join('')}
function displayTick(){let changed=false;const now=Date.now();for(const t of timers){if(t.status==='running'&&seconds(t,now)<=0){t.status='ended';t.remaining=0;t.endAt=null;t.silenced=false;changed=true}}
 if(changed){save();render();alarmStart();releaseWake()}else{for(const el of $('timers').querySelectorAll('.timer')){const t=timers.find(x=>x.id===el.dataset.id);if(!t)continue;const s=seconds(t,now),time=el.querySelector('[data-time]'),ring=el.querySelector('[data-ring]');if(time)time.textContent=duration(s);if(ring)ring.setAttribute('stroke-dashoffset',String((2*Math.PI*45*(1-Math.max(0,Math.min(1,s/t.duration)))).toFixed(3)));const bar=el.querySelector('[data-bar]');if(bar)bar.style.setProperty('--progress',(Math.round((1-Math.max(0,Math.min(1,s/t.duration)))*100))+'%')}}
 clock();if(Date.now()-lastSave>4000&&timers.some(t=>t.status==='running')){lastSave=Date.now();save()}}
function closeModal(){modalMode='';activeId=null;pendingProtectedAction=null;$('overlay').hidden=true;$('dialogBody').innerHTML=''}
function openModal(title,html,mode='') {modalMode=mode;$('dialogTitle').textContent=title;$('dialogBody').innerHTML=html;$('overlay').hidden=false;setTimeout(()=>{$('overlay').querySelector('input')?.focus()},60)}
function foot(ok='SALVA',cancel='ANNULLA'){return `<footer><button type="button" class="btn" data-modal="close">${cancel}</button><button class="btn primary" type="submit">${ok}</button></footer>`}
function swatches(){return `<div class="color-picker" role="group" aria-label="Colore del timer">${COLORS.map(c=>`<button type="button" class="swatch ${c.key===choiceColor?'selected':''}" style="--swatch:${c.hex}" data-color="${c.key}" aria-label="${c.label}" title="${c.label}" aria-pressed="${c.key===choiceColor}"></button>`).join('')}</div>`}
function numFields(s){return `<div class="duration-fields"><div><label for="hours">Ore</label><input id="hours" name="hours" type="number" inputmode="numeric" min="0" max="999" value="${Math.floor(s/3600)}" required></div><div><label for="minutes">Minuti</label><input id="minutes" name="minutes" type="number" inputmode="numeric" min="0" max="59" value="${Math.floor(s%3600/60)}" required></div><div><label for="secs">Secondi</label><input id="secs" name="secs" type="number" inputmode="numeric" min="0" max="59" value="${s%60}" required></div></div>`}
function fullManual(){choiceColor='blue';openModal('Nuovo timer manuale',`<form id="fullManual"><label for="cookName">Nome della cottura</label><input id="cookName" name="name" type="text" placeholder="Es. Brasato a bassa temperatura" maxlength="120" required><label>Durata</label>${numFields(600)}<label>Colore identificativo</label>${swatches()}<div class="error" id="modalError"></div>${foot('AVVIA TIMER')}</form>`,'manual')}
function validDuration(form){const h=Number(form.elements.hours.value),m=Number(form.elements.minutes.value),s=Number(form.elements.secs.value);if(![h,m,s].every(Number.isInteger)||h<0||h>999||m<0||m>59||s<0||s>59||h*3600+m*60+s<=0)return 0;return h*3600+m*60+s}
function manage(){openModal('Tempi predefiniti',`<p>Tocca una cottura per avviarla; modifica nomi, durate e colori qui sotto.</p><div class="presets-list">${presets.map(p=>`<div class="preset-row" style="--accent:${accent(p.color)}"><span class="dot"></span><div class="details"><strong>${safe(p.name)}</strong><small>${presetDur(p.secs)}</small></div><button class="btn" type="button" data-modal="startpreset" data-id="${safe(p.id)}">AVVIA</button><button class="btn" type="button" data-modal="editpreset" data-id="${safe(p.id)}">MODIFICA</button></div>`).join('')}</div><footer><button type="button" class="btn" data-modal="close">CHIUDI</button><button type="button" class="btn primary" data-modal="newpreset">+ AGGIUNGI COTTURA</button></footer>`,'manage')}
function editPreset(id){const p=presets.find(x=>x.id===id);editId=p?.id||null;choiceColor=p?.color||'blue';openModal(p?'Modifica cottura':'Aggiungi cottura',`<form id="presetEdit"><label for="presetName">Nome della cottura</label><input id="presetName" name="name" type="text" value="${safe(p?.name||'')}" maxlength="120" required><label>Durata</label>${numFields(p?.secs||600)}<label>Colore identificativo</label>${swatches()}<div class="error" id="modalError"></div><footer><button class="btn" type="button" data-modal="manage">INDIETRO</button>${p?'<button class="btn" type="button" data-modal="deletepreset">ELIMINA</button>':''}<button class="btn primary" type="submit">SALVA</button></footer></form>`,'editPreset')}
function settings(){openModal('Impostazioni',`<div class="settings-row"><span>Allarme sonoro ripetuto</span><input id="soundSwitch" type="checkbox" ${sound?'checked':''} aria-label="Attiva audio"></div><div class="settings-row"><span>Prova il suono di allarme</span><button type="button" class="btn" data-modal="testsound">PROVA SUONO</button></div><div class="settings-row"><span>Tempi predefiniti</span><button type="button" class="btn" data-modal="manage">GESTISCI</button></div><p class="notice">Il volume dipende anche dall'iPad. Mantieni l'app in primo piano e il volume alto: Safari può sospendere audio e attività quando lo schermo è bloccato o passi ad altre app.</p><footer><button class="btn primary" type="button" data-modal="close">FATTO</button></footer>`,'settings')}
function pinModal(t,action='unlock'){activeId=t.id;pendingProtectedAction=action;const unlocking=Boolean(t.pin);openModal(unlocking?'Timer protetto':'Blocca timer',`<p>${unlocking?'Inserisci il PIN per '+(action==='delete'?'cancellare':action==='reset'?'resettare':'sbloccare')+' il timer.':'Imposta un PIN di 4 cifre. Il timer continuerà a funzionare, ma reset ed eliminazione richiederanno il codice.'}</p><form id="pinForm"><label for="pin">${unlocking?'PIN':'Nuovo PIN (4 cifre)'}</label><input id="pin" name="pin" type="password" autocomplete="off" inputmode="numeric" minlength="4" maxlength="4" pattern="[0-9]{4}" placeholder="••••" required><div class="error" id="modalError"></div>${foot(unlocking?'CONFERMA':'ATTIVA LUCCHETTO')}</form>`,'pin')}
function confirmDelete(t){activeId=t.id;openModal('Eliminare il timer?',`<p>Vuoi eliminare definitivamente il timer <strong style="color:white">${safe(t.name)}</strong>?</p><footer><button class="btn" type="button" data-modal="close">ANNULLA</button><button class="btn primary" type="button" data-modal="confirmdelete">ELIMINA TIMER</button></footer>`,'delete')}
function doAction(t,action){ensureAudio();if(action==='pause'&&t.status==='running'){t.remaining=seconds(t);t.endAt=null;t.status='paused'}else if(action==='resume'&&t.status==='paused'){t.endAt=Date.now()+t.remaining*1000;t.status='running'}else if(action==='silence'&&t.status==='ended'){t.silenced=true;stopSoundIfClear()}else if(action==='repeat'){t.status='running';t.remaining=t.duration;t.endAt=Date.now()+t.duration*1000;t.silenced=false;stopSoundIfClear()}else if(action==='reset'){t.status='paused';t.remaining=t.duration;t.endAt=null;t.silenced=true;stopSoundIfClear()}else if(action==='delete'){timers=timers.filter(x=>x.id!==t.id);stopSoundIfClear()}save();render();wakeUp();releaseWake()}
function demo(){if(timers.length)return;const samples=[['Cottura pizza tonda',420,0,'red','ended'],['Brasato a bassa temperatura',10800,5075,'yellow','paused'],['Verdure al vapore',300,195,'green','paused'],['Sugo di pomodoro',900,760,'blue','paused'],['Patate arrosto',2400,1800,'orange','paused'],['Riso basmati',720,460,'purple','paused'],['Focaccia alle olive',900,390,'red','paused'],['Pollo al forno con verdure',3600,2150,'green','paused']];for(const [name,tot,rem,color,status] of samples){timers.push({id:uid(),name,duration:tot,remaining:rem,endAt:null,status,color,kind:'demo',pin:'',silenced:true})}save();render()}
document.querySelectorAll('[data-columns]').forEach(b=>b.addEventListener('click',()=>setColumns(b.dataset.columns)));
$('quickForm').addEventListener('submit',e=>{e.preventDefault();const n=$('quickName').value.trim(),m=Number($('quickMinutes').value);if(!n||!Number.isInteger(m)||m<=0||m>9999){alert('Inserisci un nome e un tempo valido (almeno 1 minuto).');return}start(n,m*60,'blue');$('quickName').value=''});
$('presetButtons').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(!b)return;const p=presets.find(x=>x.id===b.dataset.preset);if(p)start(p.name,p.secs,p.color,'preset')});
$('timers').addEventListener('click',e=>{if(e.target.closest('#demoButton'))return demo();if(e.target.closest('#showCustom'))return fullManual();const btn=e.target.closest('[data-action]');if(!btn)return;const t=timers.find(x=>x.id===btn.closest('.timer')?.dataset.id);if(!t)return;const act=btn.dataset.action;
 if(act==='toggle'){if(t.status==='ended'){doAction(t,t.silenced?'repeat':'silence')}else doAction(t,t.status==='paused'?'resume':'pause')}
 else if(act==='lock'){pinModal(t,'unlock')}
 else if((act==='delete'||act==='reset')&&t.pin){pinModal(t,act)}
 else if(act==='delete'){confirmDelete(t)}
 else if(act==='reset'){doAction(t,'reset')}
});
$('settingsButton').addEventListener('click',()=>{ensureAudio();settings()});$('manageButton').addEventListener('click',manage);$('advancedButton').addEventListener('click',fullManual);
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});$('closeDialog').addEventListener('click',closeModal);
$('dialogBody').addEventListener('click',e=>{const sw=e.target.closest('[data-color]');if(sw){choiceColor=sw.dataset.color;for(const b of $('dialogBody').querySelectorAll('.swatch')){const selected=b.dataset.color===choiceColor;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected))}return}
 const b=e.target.closest('[data-modal]');if(!b)return;const action=b.dataset.modal;if(action==='close')closeModal();else if(action==='manage')manage();else if(action==='newpreset')editPreset(null);else if(action==='editpreset')editPreset(b.dataset.id);else if(action==='startpreset'){const p=presets.find(x=>x.id===b.dataset.id);if(p){closeModal();start(p.name,p.secs,p.color,'preset')}}else if(action==='deletepreset'){if(!editId)return;if(confirm('Eliminare questo tempo predefinito?')){presets=presets.filter(x=>x.id!==editId);save();renderPresets();manage()}}else if(action==='confirmdelete'){const t=timers.find(x=>x.id===activeId);if(t)doAction(t,'delete');closeModal()}else if(action==='testsound'){ensureAudio();beep()} });
$('dialogBody').addEventListener('change',e=>{if(e.target.id==='soundSwitch'){sound=e.target.checked;if(!sound){soundPlaying=false;clearInterval(alarmLoop);alarmLoop=null}else {ensureAudio();alarmStart()}save()}});
$('dialogBody').addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='fullManual'){const d=validDuration(f),name=f.elements.name.value.trim();if(!d||!name){$('modalError').textContent='Inserisci un nome e un tempo valido.';return}closeModal();start(name,d,choiceColor)}else if(f.id==='presetEdit'){const d=validDuration(f),name=f.elements.name.value.trim();if(!d||!name){$('modalError').textContent='Inserisci un nome e un tempo valido.';return}if(editId){const p=presets.find(x=>x.id===editId);if(p){p.name=name;p.secs=d;p.color=choiceColor}}else presets.push({id:uid(),name,secs:d,color:choiceColor});save();renderPresets();manage()}else if(f.id==='pinForm'){const t=timers.find(x=>x.id===activeId),pin=f.elements.pin.value;if(!t)return;if(!/^\d{4}$/.test(pin)){$('modalError').textContent='Il PIN deve contenere 4 cifre.';return}if(!t.pin){t.pin=pin;save();render();closeModal()}else if(pin!==t.pin){$('modalError').textContent='PIN non corretto.';return}else{const action=pendingProtectedAction;if(action==='unlock'){t.pin='';save();render()}else doAction(t,action);closeModal()}}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){ensureAudio();displayTick();if(timers.some(t=>t.status==='ended'&&!t.silenced))alarmStart();wakeUp()}});
window.addEventListener('pageshow',()=>{displayTick()});window.addEventListener('pagehide',save);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)closeModal()});
// Recover accurate countdowns using absolute deadlines, including after an iPad screen wake.
setColumns(columns);renderPresets();render();displayTick();setInterval(displayTick,250);if(timers.some(t=>t.status==='running'))wakeUp();
})();
</script>
</body>
</html>
